# A config file to start from: a standalone node with the embedded store in the data volume. The
# image runs without a config file by default; mount yours over /etc/antirion/antirion.yaml and run
# `serve --config /etc/antirion/antirion.yaml` to use it. Without auth.admin.bootstrap_token, a
# bootstrap token is generated into /var/lib/antirion/data and its path is logged at startup.
version: 1
server:
  listen: "0.0.0.0:8080"
admin:
  listen: "0.0.0.0:8081"
store:
  backend: embedded
  embedded:
    path: "/var/lib/antirion/data"
  spool:
    path: "/var/lib/antirion/data/spool"
